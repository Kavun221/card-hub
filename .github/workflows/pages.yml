# ============================================================================
#  Publishes the website to GitHub Pages every time you push to the main branch.
#  Only the public/ folder is published – server/, docs and data/ are NOT put online.
#  Private cards (they need the password on your own PC) are removed before publishing.
#  (Settings → Pages → Source must be set to "GitHub Actions".)
# ============================================================================
name: Deploy Card Hub to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:          # also lets you run it by hand from the Actions tab

# Least privilege: read the code, write only to Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
      - name: Leave private cards out of the public site
        # add more folders here if you make more private cards
        run: rm -rf public/cards/converter
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload the public folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
